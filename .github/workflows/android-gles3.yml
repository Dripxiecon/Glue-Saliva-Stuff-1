name: Android GLES3 build check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android-gles3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure Android arm64 GLES3 library
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release
          -DGSS_BUILD_TESTS=OFF
          -DGSS_BUILD_EXAMPLES=OFF
          -DGSS_ENABLE_GLES3=ON
      - name: Compile Android GLES3 renderer
        run: cmake --build build-android --parallel
