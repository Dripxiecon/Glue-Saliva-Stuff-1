name: Live geometry lab (GitHub Pages)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Configure WebAssembly build
        run: emcmake cmake -S . -B build-web -DGSS_BUILD_TESTS=OFF -DGSS_BUILD_EXAMPLES=OFF
      - name: Build live geometry module
        run: cmake --build build-web --parallel
      - name: Assemble site
        run: cp web/index.html build-web/site/index.html
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: live-geometry-lab-site
          path: build-web/site
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: live-geometry-lab-site
          path: site
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
